[package]
name = "faultpoint-rewrite"
version = "0.1.0"
edition = "2024"
description = "Copies a Rust crate and places fault points in the copy"

[dependencies]
syn = { version = "2", features = ["full", "visit-mut", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
faultpoint = { path = "../faultpoint" }
prettyplease = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
cargo_metadata = "0.19"
