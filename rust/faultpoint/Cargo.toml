[package]
name = "faultpoint"
version = "0.1.0"
edition = "2024"
description = "Fault points that both inject and observe faults, for counterfactual causal edge discovery"

[features]
default = []
# The rpc_server boundary as a tower layer, which the rewriter wires at axum::serve.
tower = ["dep:tower", "dep:http", "dep:tokio", "dep:regex", "dep:opentelemetry_sdk", "dep:opentelemetry-http"]
# The store points the rewriter places at sqlx and redis-rs call sites; the copy supplies the client's own types.
store = ["dep:tokio", "dep:regex", "dep:sqlparser"]
# Protocol boundaries inserted in the dependency copies of reqwest and tonic.
client = ["dep:tokio", "dep:http", "dep:regex", "dep:opentelemetry_sdk", "dep:opentelemetry-http"]

[dependencies]
opentelemetry = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
inventory = "0.3"
gethostname = "1"
libc = "0.2"
tower = { version = "0.5", optional = true }
http = { version = "1", optional = true }
tokio = { version = "1", features = ["time", "macros"], optional = true }
regex = { version = "1", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
opentelemetry-http = { version = "0.33", optional = true }
sqlparser = { version = "0.64", features = ["visitor"], optional = true }
