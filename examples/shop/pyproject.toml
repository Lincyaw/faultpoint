[project]
name = "shop"
version = "1.0.0"
description = "The driver of the five-language shop: its workloads, its build, and one repetition under a rule set"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop"]
