[project]
name = "faultsearch-local"
version = "0.1.0"
description = "The local executor of faultsearch: runs a registered system's repetitions in local containers, records them in run directories, and drives the search from the command line"
requires-python = ">=3.12"
dependencies = [
    "faultsearch",
    "faultpoint[tools]",
    "pydantic>=2.9",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.scripts]
faultsearch = "faultsearch_local.cli:app"

[tool.uv.sources]
faultsearch = { path = "..", editable = true }
faultpoint = { path = "../../python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultsearch_local"]
