[project]
name = "faultpoint"
version = "0.1.0"
description = "Fault points that both inject and observe faults, for counterfactual causal edge discovery"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Baggage and trace context are read through the OpenTelemetry API so that an instrumented system propagates them without help.
    "opentelemetry-api>=1.27",
]

[project.optional-dependencies]
http = ["httpx>=0.27"]
sql = ["sqlglot>=25"]
tools = ["typer>=0.12", "rich>=13", "scipy>=1.13"]

[project.scripts]
faultpoint = "faultpoint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultpoint"]
