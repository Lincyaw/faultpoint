[project]
name = "faultpoint"
version = "0.1.0"
description = "Fault points that both inject and observe faults, for counterfactual causal edge discovery"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Baggage and trace context are read through the OpenTelemetry API so that an instrumented system propagates them without help.
    "opentelemetry-api>=1.27",
    "wrapt>=2.0",
    "sqlglot>=25",
]

[project.optional-dependencies]
tools = ["typer>=0.12", "rich>=13", "scipy>=1.13", "jsonschema>=4.23"]

[project.scripts]
faultpoint = "faultpoint.tools.cli:app"

[project.entry-points."faultpoint.plugins"]
points = "faultpoint.points:PLUGIN"
import-hook = "faultpoint.hook:PLUGIN"
httpx = "faultpoint.adapters.http:HTTPX"
httpx2 = "faultpoint.adapters.http:HTTPX2"
asgi = "faultpoint.adapters.http:ASGI"
dbapi = "faultpoint.adapters.dbapi:PLUGIN"
psycopg = "faultpoint.adapters.psycopg:PLUGIN"
redis = "faultpoint.adapters.redis:PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultpoint"]

[tool.hatch.build.targets.wheel.force-include]
"../spec/kinds.json" = "faultpoint/tools/kinds.json"
"../spec/redis-commands.json" = "faultpoint/adapters/redis-commands.json"
